a campfire.`,home:`A lazy summer of family picnics and long afternoons.`}},new_sibling:{title:`A New Arrival`,text:`Your family has grown: meet your new baby sibling, {npc}! Sleep will be rare for a while.`},sleepover:{title:`Sleepover`,text:`{npc} invites you to a sleepover this weekend.`,c:{go:`Pack your sleeping bag`,host:`Suggest having it at your place`,decline:`Stay home`},r:{go:`Pillow forts, ghost stories and zero sleep. Perfect.`,host:`Your family made pancakes in the morning. {npc} still talks about them.`,decline:`{npc} seemed a little hurt.`}},museum_trip:{title:`Field Trip`,text:`On a class trip to the natural history museum, you stood under a dinosaur skeleton and forgot to breathe.`},learn_bike:{title:`Two Wheels`,text:`After many scraped knees, you finally rode a bicycle on your own. Freedom!`},first_phone:{title:`Your First Phone`,text:`You finally got your own phone. The whole world fits in your pocket.`,c:{all_in:`Join every app and group chat`,balanced:`Set some limits`,decline:`Keep it for calls only`},r:{all_in:`You are always in the loop now, and always a little tired.`,balanced:`Notifications off after nine. Your sleep thanks you.`,decline:`You missed some jokes, but read three novels instead.`}},exam_cheat:{title:`The Answers`,text:`A classmate whispers that the answers to the big exam are circulating, and offers you a copy.`,c:{cheat:`Take the copy`,study:`Study all night instead`,report:`Warn the teacher`},r:{cheat_ok:`You aced the exam. Nobody found out, but the grade feels hollow.`,cheat_fail:`The teacher had changed the questions. You were caught and your family was called in.`,study:`You stumbled into the exam exhausted, but you knew the material cold.`,report:`The exam was rewritten. Some classmates were furious with you; the teachers were not.`}},house_party:{title:`The House Party`,text:`Someone’s parents are away for the weekend, and the whole grade is invited.`,c:{wild:`Go and stay until the end`,early:`Go, but leave early`,stay:`Stay home`},r:{wild_ok:`A legendary night. You got home before anyone noticed.`,wild_fail:`The neighbors called the police. Your family picked you up. The silence in the car was loud.`,early:`You caught the best part and slept in your own bed.`,stay:`You heard all about it on Monday. It sounded both amazing and terrible.`}},dare_shoplift:{title:`The Dare`,text:`Your friends dare you to swipe a candy bar from the corner store. They are watching.`,c:{do_it:`Do it`,refuse:`Refuse`,pay:`Pay for it secretly and pretend`},r:{do_it_ok:`You walked out with the candy bar and a racing heart. Your friends cheered. You feel strange about it.`,do_it_fail:`The owner caught you at the door, called your family and filed a report.`,refuse:`Your friends called you boring. Some of them respected it later.`,pay:`Your friends never knew. You kept your conscience and your reputation.`}},start_band:{title:`Garage Band`,text:`Some friends are starting a band in a garage and need one more person.`,c:{join:`Grab an instrument and join`,manage:`Become their manager`,decline:`Not for you`},r:{join:`You are terrible. Everyone is terrible. It is the best thing ever.`,manage:`You designed flyers and booked the band’s first rehearsal space.`,decline:`You heard them practicing from three streets away. You are glad you declined.`}},band_gig:{title:`The First Gig`,text:`Your band got its first real gig: a Friday night at a local café.`,c:{originals:`Play your own songs`,covers:`Play safe crowd-pleasers`,quit:`Leave the band before the show`},r:{originals_ok:`The café owner asked you back. Someone in the audience was humming your chorus.`,originals_fail:`Feedback screeched, a string snapped, and half the crowd left. Rock and roll.`,covers:`Everyone sang along. Not art, but definitely fun.`,quit:`You walked away. The band played without you and was, honestly, fine.`}},band_reunion:{title:`The Reunion Call`,text:`An old bandmate calls: a promoter wants your teenage band for a nostalgia festival.`,c:{reunite:`Get the band back together`,pitch:`Pitch the new songs you have written`,decline:`Leave the past in the past`},r:{reunite:`Older, slower, louder. The crowd loved it and so did you.`,pitch_ok:`A label rep heard your new material and offered a record deal!`,pitch_fail:`The label passed. The festival was still a blast.`,decline:`You listened to an old recording that night and smiled.`}},part_time_offer:{title:`Weekend Job`,text:`Local businesses are hiring teenagers for weekend shifts.`,c:{shop:`Work at the corner shop`,kitchen:`Work in a café kitchen`,decline:`Keep your weekends free`},r:{shop:`You learned to count change fast and smile at grumpy customers.`,kitchen:`Hot, loud and chaotic. You love it more than you expected.`,decline:`Your weekends stay yours, for now.`}},friend_in_trouble:{title:`A Friend in Trouble`,text:`{npc}’s family is losing their home. {npc} quietly asks if they could stay with you for a few weeks.`,c:{host:`Ask your family to take {npc} in`,lend:`Give {npc} half your savings`,adult:`Tell a trusted adult who can help`,refuse:`Say you cannot help`},r:{host:`It was cramped and your family grumbled, but {npc} will never forget it.`,lend:`{npc} protested, then accepted with tears in their eyes.`,adult:`The school counselor found the family support. {npc} was grateful, if a bit embarrassed.`,refuse:`{npc} said they understood. Things were never quite the same.`}},scholarship_competition:{title:`The Scholarship Exam`,text:`A foundation is offering university scholarships to the best young science students. The exam is next month.`,c:{prepare:`Prepare like your future depends on it`,relaxed:`Take it without much preparation`,skip:`Skip it`},r:{prepare_ok:`You won! Most of your university tuition will be covered.`,prepare_fail:`You missed the cut by a few points. All that studying still sharpened your mind.`,relaxed_ok:`Against the odds, you won a partial scholarship.`,relaxed_fail:`You did not place. Maybe you should have prepared.`,skip:`You spent that month on other things.`}},driving_lesson:{title:`Empty Parking Lot`,text:`{npc} offers to teach you to drive in an empty parking lot on Sunday morning.`,c:{careful:`Take it slow and listen`,fast:`Show off a little`,later:`Maybe next year`},r:{careful:`Mirrors, signals, patience. You will be ready for the test.`,fast_ok:`You pulled a perfect turn and {npc} laughed out loud.`,fast_fail:`You met a lamppost. Gently. {npc} was very quiet on the way home.`,later:`The car keys stayed on the hook.`}},sports_tryout:{title:`Team Tryouts`,text:`Tryouts for the school team are this afternoon.`,c:{tryout:`Give it everything`,cheer:`Cheer from the stands`,skip:`Go home and read`},r:{tryout_ok:`You made the team! Practice is brutal and you love it.`,tryout_fail:`You did not make it this time. The coach told you to come back next year.`,cheer:`You were the loudest voice in the stands.`,skip:`You finished a great book instead.`}},dropout_temptation:{title:`Why Bother?`,text:`School feels pointless. A cousin says there is warehouse work paying cash right now.`,c:{drop:`Leave school and take the job`,stay:`Grit your teeth and stay`,counselor:`Talk to the school counselor`},r:{drop:`You walked out of school for the last time. The paychecks are real. So is the worry at home.`,stay:`It is hard, but you are still here.`,counselor:`The counselor helped you build a plan. School feels a little less pointless.`}},picture_day:{title:`Picture Day`,text:`A giant pimple chose picture day to appear. The yearbook will preserve it forever.`},volunteer_shelter:{title:`Giving Back`,text:`Your school asks students to volunteer for a few weekends.`,c:{animals:`Help at the animal shelter`,food_bank:`Sort donations at the food bank`,busy:`Too busy right now`},r:{animals:`You walked dogs and cleaned cages, and came home covered in fur and happiness.`,food_bank:`You sorted tons of food and met people from all over town.`,busy:`Maybe next time.`}},viral_video:{title:`Going Viral`,text:`A video of you dancing badly at a family party has gone viral overnight.`,c:{lean_in:`Lean in and post more`,delete:`Ask for it to be taken down`,laugh:`Laugh along`},r:{lean_in_ok:`Your follow-up videos were a hit. A local brand even sent you a small check.`,lean_in_fail:`The internet turned on you. The comments were brutal.`,delete:`It took weeks, but the video faded away.`,laugh:`You owned it. People liked you more for it.`}},career_fair:{title:`Career Fair`,text:`The school gym is full of booths from local employers and colleges.`,c:{tech:`The technology booth`,health:`The hospital booth`,trades:`The electricians’ booth`,people:`The law and teaching booth`},r:{tech:`You spent an hour playing with a robot arm. Something clicked.`,health:`A nurse told stories that stayed with you for weeks.`,trades:`You wired a light bulb by yourself and felt like a wizard.`,people:`A judge and a teacher argued about who has the harder job. You were fascinated.`}},talent_show:{title:`Talent Show`,text:`The school talent show needs acts. Sign-ups close today.`,c:{sing:`Sing a song`,comedy:`Do a stand-up routine`,watch:`Watch from the crowd`},r:{sing_ok:`Your voice cracked once, and nobody cared. Standing ovation.`,sing_fail:`You forgot the second verse and hummed it. The crowd hummed along, kindly.`,comedy_ok:`The gym roared with laughter. Even the principal laughed.`,comedy_fail:`Crickets. One cough. You will laugh about it someday.`,watch:`You cheered for every act, even the kid who played the spoons.`}},grandparent_story:{title:`Old Stories`,text:`{npc} spent an evening telling you stories about growing up. You realized how much you did not know.`},after_school:{title:`What Comes Next`,text:`School is over. The future is wide open, which is exciting and terrifying.`,c:{study:`Focus on further studies`,work:`Focus on finding work`,gap:`Take a gap year to travel`,slow:`Take it one day at a time`},r:{study:`You started reading course catalogs. (You can enroll in the School & Work tab.)`,work:`You polished a résumé. Employers will notice the drive for the next few years.`,gap:`Hostels, trains and new friends. You came back with stories and a wider view of the world.`,slow:`No rush. You will figure it out.`}},roommate:{title:`The Roommate Situation`,text:`Your roommate leaves dirty dishes everywhere and “borrows” your food.`,c:{confront:`Have a frank talk`,clean:`Just clean it yourself`,chart:`Make a chore chart`},r:{confront_ok:`It was awkward, but the dishes started getting washed.`,confront_fail:`It turned into a fight. The apartment is tense now.`,clean:`Clean kitchen, quiet resentment.`,chart:`The chart actually worked. You are a household genius.`}},campus_party:{title:`Campus Party`,text:`There is a huge party on campus the night before an important exam.`,c:{go:`Go to the party`,study:`Study instead`,group:`Host a study group with snacks`},r:{go:`You made a new friend and remembered almost nothing about the exam material.`,study:`Quiet night, solid exam.`,group:`Half studying, half laughing. Everyone passed.`}},meet_cute:{title:`A Spark`,text:`At a friend’s birthday, you keep ending up in the same conversation with {npc}.`,c:{ask_out:`Ask {npc} out`,numbers:`Exchange numbers as friends`,leave:`Let the moment go`},r:{ask_out_ok:`{npc} said yes before you finished the question. You are dating!`,ask_out_fail:`{npc} smiled kindly and said no. Ouch.`,numbers:`You stayed in touch. A good friendship, at least for now.`,leave:`You went home early and wondered what might have been.`}},old_flame:{title:`An Old Flame`,text:`At a train station, you bump into {npc}, your ex, for the first time in years.`,c:{coffee:`Grab a coffee and catch up`,rekindle:`See if there is still something there`,nod:`Nod politely and move on`},r:{coffee:`Two hours flew by. You left as friends, which felt right.`,rekindle_ok:`There was. You are together again, older and wiser.`,rekindle_fail:`There was not. It was a little sad and a little freeing.`,nod:`You both smiled and went your separate ways.`}},friend_startup:{title:`The Big Idea`,text:`{npc}, your friend since childhood, is starting a company and wants you on board.`,c:{join:`Quit your plans and join`,invest:`Invest some savings`,advice:`Offer advice, nothing more`,decline:`Wish {npc} luck`},r:{join:`Long nights, cheap pizza, huge dreams. You are a startup employee now.`,invest:`You wrote a check. {npc} framed a copy of it.`,advice:`You spent an evening sketching plans with {npc}. It felt like the old days.`,decline:`{npc} understood, but was clearly disappointed.`}},startup_outcome:{title:`The Moment of Truth`,text:`Years of work later, {npc}’s company faces its make-or-break moment.`,c:{push:`Push for a stock listing`,sell:`Support selling to a bigger rival`,cash_out:`Ask to cash out your investment`,stand_by:`Simply stand by {npc}`},r:{push_ok:`The listing was a triumph. Your shares are worth a fortune!`,push_fail:`Investors backed out at the last minute. The company folded and you lost your job.`,sell:`The sale went through. A comfortable payout, and you kept a job at the new owner.`,cash_out_ok:`Your investment paid off handsomely.`,cash_out_fail:`The company could not pay. Your investment is gone.`,stand_by:`Whatever happened with the company, your friendship came out stronger.`}},mentor_offer:{title:`A Mentor Appears`,text:`{npc}, a respected veteran at work, offers to mentor you.`,c:{accept:`Accept gratefully`,decline:`Politely decline`,compete:`Prove you do not need help`},r:{accept:`Weekly coffees with {npc} are teaching you more than any course.`,decline:`{npc} nodded. The offer was not repeated.`,compete:`You worked twice as hard to show you could do it alone. It was exhausting.`}},mentor_farewell:{title:`Farewell Speech`,text:`{npc} is retiring and has asked you to give the farewell speech.`,c:{heartfelt:`Speak from the heart`,funny:`Make it funny`,decline:`Say you are not good at speeches`},r:{heartfelt_ok:`There was not a dry eye in the room. {npc} hugged you for a long time.`,heartfelt_fail:`You got emotional and lost your place. {npc} appreciated it anyway.`,funny_ok:`The room was in stitches, {npc} most of all.`,funny_fail:`One joke landed badly. Very badly.`,decline:`{npc} was hurt, though too polite to say so.`}},shady_investment:{title:`MoonPenny`,text:`An acquaintance offers you an early spot in “MoonPenny”: early members get paid by the people who join later.`,c:{buy_in:`Buy in early`,recruit:`Buy in and recruit your friends`,decline:`Decline`,report:`Report it to the authorities`},r:{buy_in:`Within weeks, your money more than doubled. Easy money… right?`,recruit:`Your friends joined and your payout was huge. Some of them are now asking questions.`,decline:`You kept your savings. It sounded too good to be true.`,report:`The scheme was shut down before it grew. Quietly, you saved a lot of people a lot of money.`}},moonpenny_probe:{title:`Investigators at the Door`,text:`MoonPenny was a pyramid scheme. Investigators are contacting early members who profited.`,c:{cooperate:`Cooperate and pay back`,lawyer:`Hire a lawyer`,deny:`Deny everything`,apologize:`Repay the friends you recruited`},r:{cooperate:`You returned the profits. It stung, but the matter was closed.`,lawyer_ok:`Your lawyer settled it quietly.`,lawyer_fail:`The court was not convinced. Heavy fines and a record.`,deny_ok:`They had bigger fish to fry. You got lucky.`,deny_fail:`Records showed everything. Huge fines, a criminal record and a damaged reputation.`,apologize:`You paid back the friends who trusted you. Most of them forgave you.`}},stress_habit:{title:`Pressure`,text:`Deadlines are piling up. On a break, a coworker offers you a cigarette “to take the edge off”.`,c:{smoke:`Take it`,run:`Go for a run instead`,vent:`Call a friend to vent`},r:{smoke:`It did take the edge off. Then you bought a pack. Then another.`,run:`You came back sweaty and clear-headed. It became a habit.`,vent:`Twenty minutes of complaining to someone who gets it. Better than any cigarette.`}},health_scare:{title:`A Warning Sign`,text:`A cough that will not go away sends you to the doctor. The scan shows warning signs from years of smoking.`,c:{quit:`Quit for good`,cut_down:`Cut down a little`,ignore:`Ignore it`},r:{quit:`The first weeks were hell. You did not give in.`,cut_down:`Fewer cigarettes. The cough stays.`,ignore:`You lit one on the way home. Your body keeps the score.`}},recovery_milestone:{title:`Breathing Easy`,text:`Years without smoking. You climb stairs without wheezing, and the money you saved adds up.`},wedding_invite:{title:`Save the Date`,text:`{npc} is getting married and really wants you there.`,c:{attend:`Attend and celebrate`,speech:`Attend and give a toast`,skip:`Send a card instead`},r:{attend:`You danced until your feet hurt. {npc} was glowing.`,speech_ok:`Your toast made the whole room laugh and then cry. Perfect.`,speech_fail:`You told the wrong story. The in-laws did not laugh.`,skip:`{npc} noticed your absence.`}},car_breakdown:{title:`Smoke Under the Hood`,text:`Your car died on the highway, smoke pouring from under the hood.`,c:{repair:`Pay a mechanic`,diy:`Watch tutorials and fix it yourself`,sell:`Sell it for scrap`},r:{repair:`Expensive, but it runs like new.`,diy_ok:`Three videos, two scraped knuckles and one working car. Victory.`,diy_fail:`You made it worse. The mechanic’s bill was even bigger.`,sell:`You sold it for parts. The bus is fine. Mostly.`}},boss_credit:{title:`Stolen Credit`,text:`In a big meeting, your manager presents your project as their own.`,c:{confront:`Speak up in the meeting`,let_go:`Let it go`,document:`Keep records and speak up later`},r:{confront_ok:`You calmly walked everyone through details only the author would know. People noticed.`,confront_fail:`It came across as an outburst. Your manager will not forget it.`,let_go:`You let it go. It still bothers you at night.`,document:`Your careful records reached the right people. Your next review was glowing.`}},layoffs:{title:`Rumors of Layoffs`,text:`Whispers of layoffs are spreading through the company. Everyone is nervous.`,c:{buyout:`Volunteer for a severance package`,harder:`Work harder than ever`,wait:`Keep your head down`},r:{buyout:`You took the money and walked out into the unknown.`,harder_ok:`You survived the cuts. Your boss noticed the effort.`,harder_fail:`It was not enough. Your position was cut.`,wait_ok:`The storm passed you by.`,wait_fail:`Your name was on the list.`}},side_business:{title:`A Taste for Business`,text:`Friends keep raving about your cooking. Why not sell it at the weekend market?`,c:{launch:`Rent a market stall`,catering:`Cater one event for money`,family:`Keep it for family dinners`},r:{launch:`You bought supplies, designed a little sign and opened your stall.`,catering:`Exhausting, but the clients loved it and paid well.`,family:`Sunday dinners became the highlight of the family’s week.`}},market_success:{title:`A Line Around the Block`,text:`Your weekend stall has a line around the block. A restaurant group is sniffing around.`,c:{expand:`Open a real restaurant`,steady:`Keep it small and steady`,sell_recipe:`Sell the recipe to the restaurant group`},r:{expand_ok:`The restaurant became a neighborhood favorite. You built something real.`,expand_fail:`Rent and staff costs crushed you. You closed within a year.`,steady:`A nice side income and happy regulars.`,sell_recipe:`A generous check. The secret recipe is not a secret anymore.`}},sibling_loan:{title:`A Favor`,text:`{npc} asks to borrow {amount} to cover rent this month.`,c:{lend:`Lend the money`,refuse:`Say no`,help_job:`Help {npc} find better work instead`},r:{lend:`{npc} promised to pay you back soon.`,refuse:`{npc} hung up angry.`,help_job:`You polished {npc}’s résumé and made calls. It meant a lot.`}},sibling_repay:{title:`An Envelope`,text:`{npc} shows up at your door with an envelope and a sheepish smile.`,c:{accept:`Open it`,forgive:`Tell {npc} to keep it`},r:{accept_ok:`The full amount, plus a little extra “for interest”. You laughed together.`,accept_fail:`Inside: an IOU and a drawing of a dollar sign. You are not sure whether to laugh.`,forgive:`{npc} hugged you. Some things are worth more than money.`}},sibling_reckoning:{title:`An Old Grudge`,text:`At a family dinner, {npc} brings up the broken window from your childhood: “You let me take the blame.”`,c:{apologize:`Apologize sincerely`,laugh:`Try to laugh it off`,deny:`Deny it ever happened`},r:{apologize:`Decades late, but {npc} accepted. Something heavy lifted.`,laugh_ok:`Everyone laughed, {npc} too. Old wounds can heal.`,laugh_fail:`{npc} did not find it funny. Dinner ended early.`,deny:`{npc} stared at you in disbelief. The rift grew deeper.`}},parent_illness:{title:`Needing Help`,text:`{npc} has been unwell and needs more help at home.`,c:{care:`Take care of {npc} yourself`,pay:`Pay for professional care`,visit:`Visit when you can`},r:{care:`Exhausting weeks, slow recovery, long conversations. You grew closer than ever.`,pay:`A caregiver now visits daily. {npc} is comfortable.`,visit:`You visit on weekends. You wish it were more.`}},parent_funeral:{title:`Saying Goodbye`,text:`The family gathers to say goodbye to {npc}.`,c:{eulogy:`Give the eulogy`,quiet:`Grieve quietly`,reconcile:`Make peace with your sibling`},r:{eulogy_ok:`Your words captured {npc} perfectly. People thanked you for weeks.`,eulogy_fail:`You could barely get the words out. Everyone understood.`,quiet:`You stood at the back and remembered.`,reconcile:`Grief opened a door. You and your sibling talked for the first time in years.`}},marathon:{title:`The City Marathon`,text:`The city marathon is in six months. Your friends dare you to sign up.`,c:{train:`Train for the full marathon`,fun_run:`Do the 5 km fun run`,couch:`Watch from the couch`},r:{train_ok:`Forty-two kilometers. You crossed the line in tears. You are a marathoner!`,train_fail:`You pulled a muscle at kilometer 28. Next year.`,fun_run:`Medal, banana, sunshine. A good day.`,couch:`You cheered from the couch. With snacks.`}},jury_duty:{title:`Jury Duty`,text:`An official letter arrives: you have been summoned for jury duty.`,c:{serve:`Serve`,excuse:`Try to get excused`},r:{serve:`Long days, a hard decision, and a new respect for how justice works.`,excuse_ok:`Your excuse was accepted.`,excuse_fail:`The judge was not impressed. You served anyway, grumbling.`}},midlife_crisis:{title:`Is This It?`,text:`You wake up one morning wondering whether this is all there is.`,c:{car:`Buy a flashy car`,learn:`Learn something completely new`,sabbatical:`Take a year off`,therapy:`Start therapy`},r:{car:`It is shiny, fast and absolutely ridiculous. You love it.`,learn:`You signed up for music lessons. Your neighbors are being patient.`,sabbatical:`You quit and spent a year walking, reading and resting. You feel like yourself again.`,therapy:`Slowly, you learned to be kinder to yourself. Setbacks hurt less now.`}},school_reunion:{title:`Class Reunion`,text:`Twenty-odd years later, your old class is having a reunion.`,c:{attend:`Go and reconnect`,apologize:`Find the kid you once teased`,brag:`Go and impress everyone`,skip:`Skip it`},r:{attend:`Same faces, more wrinkles. You laughed until your cheeks hurt.`,apologize:`You apologized for something from decades ago. They were surprised, then grateful.`,brag_ok:`Everyone wanted to hear about your life.`,brag_fail:`People rolled their eyes when you turned away.`,skip:`You saw the photos online. It looked fun.`}},adopt_cat:{title:`An Uninvited Guest`,text:`A cat has claimed your doorstep and refuses to leave.`,c:{adopt:`Let the cat in`,shelter:`Take it to a shelter`},r:{adopt:`The cat moved in, took the best chair and allowed you to call it {npc}.`,shelter:`The shelter found it a home within a week.`}},burnout:{title:`Running on Empty`,text:`You dread every workday. Sleep does not help anymore.`,c:{leave:`Take medical leave`,push:`Push through`,quit:`Quit your job`},r:{leave:`A few weeks off. Slowly, the color came back into the world.`,push:`You kept going. Your body and mood are paying the price.`,quit:`You walked out. For the first time in years, you slept well.`}},home_renovation:{title:`Renovation Fever`,text:`Your home could really use a renovation.`,c:{diy:`Do it yourself`,contractor:`Hire a contractor`,leave:`Leave it as it is`},r:{diy_ok:`It took months, but the result is beautiful and you built it.`,diy_fail:`You flooded the bathroom. The repair bill was painful.`,contractor:`Expensive, but the place feels brand new.`,leave:`The leaky faucet continues its eternal song.`}},grandchild:{title:`A New Generation`,text:`{npc} has had a baby. You are a grandparent!`},child_school_trouble:{title:`A Call from School`,text:`The school calls: {npc} got into trouble today.`,c:{talk:`Sit down and listen`,punish:`Ground them for a month`,ignore:`Kids will be kids`},r:{talk:`It turned out something was wrong at school. {npc} is grateful you listened.`,punish:`{npc} served the sentence, and slammed a lot of doors.`,ignore:`{npc} wonders whether you even care.`}},child_college:{title:`Accepted!`,text:`{npc} has been accepted to university. Tuition is expensive.`,c:{pay:`Pay for everything`,half:`Pay for half`,own_way:`They must find their own way`},r:{pay:`{npc} cried and promised to make you proud.`,half:`{npc} will take a loan for the rest, but is grateful.`,own_way:`{npc} understood, but it will be a hard few years.`}},lottery_scratch:{title:`Lucky Card`,text:`A scratch card tucked into a birthday card turned out to be a winner!`},noisy_neighbors:{title:`Party Next Door`,text:`The new neighbors throw loud parties every night.`,c:{complain:`Knock and complain`,join:`If you can’t beat them…`,earplugs:`Buy earplugs`},r:{complain_ok:`They apologized and turned it down. Peace returns.`,complain_fail:`They turned the music up. Petty war declared.`,join:`Great people, terrible music. You slept until noon.`,earplugs:`You sleep, mostly.`}},retirement_offer:{title:`One Last Year?`,text:`Your colleagues ask whether this will be your last year of work.`,c:{retire:`Yes, time to retire`,continue:`Not yet`},r:{retire:`A party, a cake, a card signed by everyone. A new chapter begins.`,continue:`You still have plenty to give. Everyone is glad you stayed.`}},blackout:{title:`Blackout`,text:`A city-wide blackout. You spent the evening playing cards by candlelight with your neighbors.`},record_surfaces:{title:`An Old Report`,text:`During a background check for a new opportunity, the old shoplifting report from your teenage years shows up.`,c:{explain:`Explain it honestly`,hide:`Say it must be a mistake`},r:{explain_ok:`They appreciated your honesty. It was a long time ago, after all.`,explain_fail:`They were polite, but you could feel the doubt.`,hide_ok:`Nobody looked further.`,hide_fail:`They checked. Being caught lying was much worse than the candy bar.`}},old_secret:{title:`The Corner Store`,text:`The corner store you once swiped a candy bar from is closing after forty years.`,c:{pay_back:`Leave an envelope with money and a note`,souvenir:`Buy something on the last day`,walk_by:`Walk past`},r:{pay_back:`You never knew whether the owner read the note. You felt lighter anyway.`,souvenir:`You bought a candy bar and paid for it this time.`,walk_by:`The old sign came down a week later.`}},parent_advice:{title:`Just Because`,text:`{npc} called just to say how proud they are of you.`},friend_moves_away:{title:`Moving Away`,text:`{npc} is moving to another city for good.`,c:{promise:`Promise to keep in touch`,party:`Throw a farewell party`,shrug:`People come and go`},r:{promise:`You set up a monthly call. Let us see if it lasts.`,party:`A night of stories and hugs. {npc} left with a full heart.`,shrug:`{npc} noticed how little you seemed to care.`}},relocation_offer:{title:`A Bigger Role, Far Away`,text:`Your company offers you a promotion, but it means moving to another city.`,c:{accept:`Take the promotion and move`,decline:`Stay near the people you love`},r:{accept:`New c _down:`Menos cigarrillos. La tos sigue.`,ignore:`Encendiste uno de camino a casa. El cuerpo pasa factura.`}},recovery_milestone:{title:`Respirar con calma`,text:`Años sin fumar. Subes escaleras sin silbidos en el pecho, y el dinero ahorrado se acumula.`},wedding_invite:{title:`Reserva la fecha`,text:`{npc} se casa y quiere de verdad que estés allí.`,c:{attend:`Ir y celebrar`,speech:`Ir y hacer un brindis`,skip:`Enviar una tarjeta`},r:{attend:`Bailaste hasta que te dolieron los pies. {npc} estaba radiante.`,speech_ok:`Tu brindis hizo reír a toda la sala y luego llorar. Perfecto.`,speech_fail:`Contaste la historia equivocada. La otra familia no se rio.`,skip:`{npc} notó tu ausencia.`}},car_breakdown:{title:`Humo bajo el capó`,text:`Tu coche murió en la autopista, con humo saliendo del capó.`,c:{repair:`Pagar un taller`,diy:`Ver tutoriales y arreglarlo por tu cuenta`,sell:`Venderlo como chatarra`},r:{repair:`Caro, pero funciona como nuevo.`,diy_ok:`Tres vídeos, dos nudillos raspados y un coche que funciona. Victoria.`,diy_fail:`Lo empeoraste. La factura del taller fue todavía mayor.`,sell:`Lo vendiste por piezas. El autobús sirve. Casi siempre.`}},boss_credit:{title:`Mérito robado`,text:`En una reunión importante, tu jefatura presenta tu proyecto como si fuera propio.`,c:{confront:`Hablar en la reunión`,let_go:`Dejarlo pasar`,document:`Guardar registros y hablar después`},r:{confront_ok:`Con calma, explicaste detalles que solo la autoría conocería. Todo el mundo lo notó.`,confront_fail:`Pareció un arrebato. Tu jefatura no lo olvidará.`,let_go:`Lo dejaste pasar. Todavía te molesta por las noches.`,document:`Tus registros llegaron a las personas adecuadas. Tu siguiente evaluación fue brillante.`}},layoffs:{title:`Rumores de despidos`,text:`Los rumores de recortes se extienden por la empresa. Hay nervios por todas partes.`,c:{buyout:`Acogerte a un plan de salida voluntaria`,harder:`Trabajar más que nunca`,wait:`No llamar la atención`},r:{buyout:`Tomaste el dinero y salist `A dona da carteira quase chorou. A fama da sua honestidade correu o bairro.`,keep:`O dinheiro sumiu em uma semana. A culpa durou mais.`,leave:`Você seguiu em frente. Outra pessoa que resolva.`}},grandparent_recipe:{title:`A receita secreta`,text:`{npc} oferece ensinar a receita da família que ninguém mais teve a honra de aprender.`,c:{learn:`Arregaçar as mangas`,later:`Talvez outro dia`},r:{learn:`Farinha para todo lado, risadas para todo lado. Agora você carrega um pedaço da história da família.`,later:`{npc} sorriu, mas deu para notar uma pontinha de decepção.`}},spelling_bee:{title:`Concurso de soletração`,text:`A turma escolheu você para o concurso de soletração.`,c:{practice:`Treinar toda noite`,wing_it:`Confiar no instinto`,skip:`Deixar outra pessoa ir`},r:{practice_ok:`Você soletrou “otorrinolaringologista” sem piscar e levou o troféu para casa.`,practice_fail:`Você caiu em “exceção”. Mesmo assim, o treino rendeu nas aulas.`,wing_it_ok:`Só no instinto, você chegou à rodada final. Impressionante!`,wing_it_fail:`Você saiu na primeira rodada. Na palavra “casa”. Com Z.`,skip:`Outra pessoa foi. Você torceu da plateia.`}},parent_job_loss:{title:`Tempos difíceis`,text:`{npc} perdeu o emprego. A casa está mais quieta, e os adultos cochicham sobre contas.`,c:{savings:`Oferecer seu cofrinho`,cheer:`Fazer um cartão para animar`,quiet:`Ficar fora do caminho`},r:{savings:`{npc} abraçou você por muito tempo e não aceitou nenhuma moeda. Bom, talvez algumas.`,cheer:`Seu cartão ficou na geladeira por anos.`,quiet:`Você ficou no quarto. A casa pareceu pesada por meses.`}},summer_camp:{title:`Acampamento de férias`,text:`Sua família pode mandar você para um acampamento neste ano. Qual?`,c:{sports:`Acampamento de esportes`,science:`Acampamento de ciências`,music:`Acampamento de música`,home:`Ficar em casa nas férias`},r:{sports:`Três semanas de corrida, natação e queimadura de sol. Você voltou mais forte.`,science:`Você construiu um foguete que voou de verdade. Quase sempre de ty:{title:`A festa em casa`,text:`Os pais de alguém viajaram no fim de semana, e a série inteira foi convidada.`,c:{wild:`Ir e ficar até o fim`,early:`Ir, mas sair cedo`,stay:`Ficar em casa`},r:{wild_ok:`Uma noite lendária. Você chegou antes que alguém percebesse.`,wild_fail:`A vizinhança chamou a polícia. Sua família foi buscar você. O silêncio no carro foi ensurdecedor.`,early:`Você pegou a melhor parte e dormiu na própria cama.`,stay:`Na segunda, você ouviu tudo. Pareceu incrível e terrível ao mesmo tempo.`}},dare_shoplift:{title:`O desafio`,text:`As amizades desafiam você a pegar um chocolate da mercearia da esquina sem pagar. Estão olhando.`,c:{do_it:`Topar`,refuse:`Recusar`,pay:`Pagar escondido e fingir`},r:{do_it_ok:`Você saiu com o chocolate e o coração disparado. A turma vibrou. Você ficou com uma sensação estranha.`,do_it_fail:`O dono pegou você na porta, ligou para sua família e registrou uma ocorrência.`,refuse:`A turma disse que você era sem graça. Algumas pessoas respeitaram isso depois.`,pay:`A turma nunca soube. Você manteve a consciência limpa e a reputação.`}},start_band:{title:`Banda de garagem`,text:`Algumas amizades estão montando uma banda numa garagem e precisam de mais uma pessoa.`,c:{join:`Pegar um instrumento e entrar`,manage:`Virar a pessoa que empresaria a banda`,decline:`Não é para você`},r:{join:`Você toca mal. Todo mundo toca mal. É a melhor coisa do mundo.`,manage:`Você fez cartazes e reservou o primeiro estúdio de ensaio da banda.`,decline:`Você ouvia os ensaios a três ruas de distância. Que bom que recusou.`}},band_gig:{title:`O primeiro show`,text:`A banda conseguiu o primeiro show de verdade: uma sexta à noite num café do bairro.`,c:{originals:`Tocar as músicas próprias`,covers:`Tocar sucessos garantidos`,quit:`Sair da banda antes do show`},r:{originals_ok:`O dono do café chamou vocês de novo. Alguém na plateia cantarolava o refrão.`,originals_fail:`Microfonia, corda arrebentada e metade do público foi embora. Rock and roll.`,cove  no mês que vem.`,c:{prepare:`Estudar como se o futuro dependesse disso`,relaxed:`Fazer sem muita preparação`,skip:`Não fazer`},r:{prepare_ok:`Você ganhou! A maior parte das mensalidades da faculdade estará coberta.`,prepare_fail:`Ficou a poucos pontos da nota de corte. Todo aquele estudo afiou sua mente mesmo assim.`,relaxed_ok:`Contra todas as probabilidades, você ganhou uma bolsa parcial.`,relaxed_fail:`Você não se classificou. Talvez devesse ter estudado.`,skip:`Você passou aquele mês fazendo outras coisas.`}},driving_lesson:{title:`Estacionamento vazio`,text:`{npc} se oferece para ensinar você a dirigir num estacionamento vazio no domingo de manhã.`,c:{careful:`Ir com calma e prestar atenção`,fast:`Exibir-se um pouco`,later:`Talvez no ano que vem`},r:{careful:`Espelhos, setas, paciência. Você vai chegar à prova com preparo de sobra.`,fast_ok:`Você fez uma curva perfeita e {npc} gargalhou.`,fast_fail:`Você conheceu um poste. De leve. {npc} ficou bem quieto na volta.`,later:`A chave do carro ficou no gancho.`}},sports_tryout:{title:`Seletiva do time`,text:`A seletiva do time da escola é hoje à tarde.`,c:{tryout:`Dar tudo de si`,cheer:`Torcer da arquibancada`,skip:`Ir para casa ler`},r:{tryout_ok:`Você entrou no time! O treino é puxado e você adora.`,tryout_fail:`Desta vez não deu. O técnico pediu para você voltar no ano que vem.`,cheer:`Sua voz foi a mais alta da arquibancada.`,skip:`Você terminou um ótimo livro.`}},dropout_temptation:{title:`Para quê?`,text:`A escola parece inútil. Uma prima diz que há trabalho num armazém, pagando em dinheiro, agora.`,c:{drop:`Largar a escola e aceitar o trabalho`,stay:`Cerrar os dentes e ficar`,counselor:`Conversar com a orientação escolar`},r:{drop:`Você saiu da escola pela última vez. O salário é real. A preocupação em casa também.`,stay:`É difícil, mas você continua lá.`,counselor:`A orientação ajudou você a montar um plano. A escola parece um pouco menos inútil.`}},picture_day:{title:`Dia da foto`,text:`Uma espinha gigante
